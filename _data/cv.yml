    - title: Research Assistant on Clustering Nationwide Dispensing Data
      institution: Belgian Pharmaceutical Association (<a href="https://www.apb.be/nl-BE">APB</a>), Belgium
      year: 2026-02 - 2026-06
      description:
        - Built a Polars pipeline converting one year of Belgian nationwide pharmacy dispensing data (~47m records) into an integer-encoded star schema, cutting storage ~8x. Derived a ~1.09m-patient type 2 diabetes cohort and engineered 83 patient-level features (14 dispensing-behavior metrics plus yearly consumption of 69 diabetes-related drug classes).
        - Implemented six distance-based clustering baselines in PyTorch on an M5 Pro GPU, as well as subsampling techniques, to fit the full cohort within a 48 GB memory constraint.
        - Profiled the resulting five clusters by ATC drug codes and provincial distribution, and translated them into recommendations for APB domain experts.
